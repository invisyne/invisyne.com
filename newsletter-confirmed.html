<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription confirmed — Invisyne</title>
  <meta name="description" content="Your Invisyne newsletter subscription is confirmed.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preload" href="/assets/fonts/GT-America-Extended-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/GT-America-Extended-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/css/main.css">
  <script>try{var t=localStorage.getItem('invisyne-theme');if(t!=='dark'&&t!=='light'){if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches){t='light'}else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){t='dark'}else{var h=new Date().getHours();t=(h<7||h>=19)?'dark':'light'}}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
</head>
<body class="subpage" data-page="resources">

  <main>

    <section class="section page-hero">
      <div class="wrap">
        <p class="kicker" data-i18n="nl.kicker">Newsletter</p>
        <h2 class="section-head" data-i18n="nl.ok.head">You're subscribed.</h2>
        <p class="lede" data-i18n="nl.ok.lede">Thanks for confirming. You'll hear from us when there's something new.</p>
        <p style="margin-top:2rem"><a class="btn btn-ghost" href="/latest.html" data-i18n="nl.ok.cta">See the latest releases</a></p>
      </div>
    </section>

  </main>

  <script src="/js/site-chrome.js"></script>
  <script src="/js/translations.de.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
